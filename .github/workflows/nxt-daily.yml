name: nxt-daily
on:
  workflow_dispatch:
  schedule:
    - cron: "5 11 * * 1-5"    # 한국 20:05 (넥스트레이드 애프터마켓 20:00 끝난 뒤)
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/nxt_snapshot.py
      - run: |
          git config user.name "krx-bot"; git config user.email "krx-bot@users.noreply.github.com"
          git add data/nxt && git commit -m "넥스트레이드 $(date +%F)" && git pull --rebase -q && git push || echo "올릴 것 없음"
