name: close-test
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/test_close.py
      - run: |
          git config user.name "krx-bot"; git config user.email "krx-bot@users.noreply.github.com"
          git add data/test_close && git commit -m "종가 출처 시험" && (git pull --rebase -q -X ours || git pull --rebase -q) && git push || echo "올릴 것 없음"
