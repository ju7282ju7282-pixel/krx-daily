name: index-history
on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1-5"    # 한국 16:20 — 매일 지수 기록도 새로
permissions:
  contents: write
jobs:
  idx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/index_history.py && python scripts/season_check.py
      - run: |
          git config user.name "krx-bot"; git config user.email "krx-bot@users.noreply.github.com"
          git add data/index data/season.json && git commit -m "지수 기록" && git pull --rebase -q && git push || echo "올릴 것 없음"
