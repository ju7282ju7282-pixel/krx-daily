name: info-test
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/test_info.py
      - run: |
          git config user.name "krx-bot"; git config user.email "krx-bot@users.noreply.github.com"
          git add data/test_info && git commit -m "정보 출처 시험" && git pull --rebase -q && git push || echo "올릴 것 없음"
