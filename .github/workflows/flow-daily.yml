name: flow-daily
on:
  workflow_dispatch:
    inputs:
      days: { description: "받을 날 수(처음엔 60)", default: "5" }
      limit: { description: "몇 종목만(0=전부)", default: "0" }
      offset: { description: "몇 번째 종목부터", default: "0" }
  schedule:
    - cron: "30 9 * * 1-5"    # 한국 18:30 — 수급(외국인·기관 확정치가 나오는 시간 뒤)
    - cron: "45 10 * * 1-5"   # 한국 19:45 — 한 번 더(저녁 8시 지도 업데이트 전)
    # 10/23 확인: 18:58·20:12 실행 모두 종목별 그날(10/23) 줄이 아직 없었음(시장 전체 합계만 있음). 10/22 파일도 실제로는 10/23 새벽에 생김.
    #   → 종목별 수급은 밤늦게/다음 날 아침에야 나오는 것으로 보임(확인 중) — 밤 23:40, 다음 날 아침 07:10 에 한 번씩 더 받음
    - cron: "40 14 * * 1-5"   # 한국 23:40
    - cron: "10 22 * * 1-5"   # 한국 다음 날 07:10
permissions:
  contents: write
concurrency: { group: flow-daily, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/flows.py ${{ github.event.inputs.days || '5' }} ${{ github.event.inputs.limit || '0' }} ${{ github.event.inputs.offset || '0' }}
      - run: |
          git config user.name "krx-bot"; git config user.email "krx-bot@users.noreply.github.com"
          git add data/flow && git commit -q -m "수급 $(date +%F)" && (git pull --rebase -q -X ours || git pull --rebase -q) && git push || echo "올릴 것 없음"
